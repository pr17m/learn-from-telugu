<title>Kannada Learning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn Kannada, Tamil, Spanish, Italian and French through Telugu: side-by-side forms with Telugu-script readings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&family=Anek+Telugu:wght@400;500;600;700&family=Anek+Kannada:wght@400;500;600;700&family=Anek+Tamil:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky left rail of modules + a reading column of comparison tables.
   Each language owns one colour: Telugu (home, indigo), Kannada (flag red), Tamil (temple teal). */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --sunk: #ECEEF2;
  --ink: #161C26;
  --muted: #5A6372;
  --line: #DCE0E6;
  --te: #3443B0;
  --kn: #B0261C;
  --ta: #0A7466;
  --te-soft: #E9EBFA;
  --kn-soft: #FBEAE8;
  --ta-soft: #E2F3F0;
  --es: #B35C00; --it: #6D3FC0; --fr: #0B6FA4;
  --es-soft: #FDF0E1; --it-soft: #F1EBFB; --fr-soft: #E3F1F9;
  --tip: #FFF6DA;
  --tip-ink: #6B4E00;
  --f-ui: "Anek Latin", "Anek Telugu", "Anek Kannada", "Anek Tamil", "Noto Sans Telugu", "Noto Sans Kannada", "Noto Sans Tamil", system-ui, sans-serif;
  --f-prose: "Source Serif 4", "Anek Telugu", "Anek Kannada", "Anek Tamil", "Noto Sans Telugu", "Noto Sans Kannada", "Noto Sans Tamil", Georgia, serif;
  --f-te: "Anek Telugu", "Noto Sans Telugu", sans-serif;
  --f-kn: "Anek Kannada", "Noto Sans Kannada", sans-serif;
  --f-ta: "Anek Tamil", "Noto Sans Tamil", sans-serif;
  --f-lat: "Anek Latin", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131A; --surface: #161B24; --sunk: #1C222D; --ink: #E6E9EF; --muted: #9AA3B2; --line: #2A313D;
    --te: #9AA6FF; --kn: #FF8C82; --ta: #5ED3C1;
    --te-soft: #1E2340; --kn-soft: #3A1E1C; --ta-soft: #12302C; --tip: #2E2814; --tip-ink: #F2D37A;
    --es: #FFB86B; --it: #C4A6FF; --fr: #6CC4F0; --es-soft: #3A2A14; --it-soft: #2A2140; --fr-soft: #12293A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131A; --surface: #161B24; --sunk: #1C222D; --ink: #E6E9EF; --muted: #9AA3B2; --line: #2A313D;
  --te: #9AA6FF; --kn: #FF8C82; --ta: #5ED3C1;
  --te-soft: #1E2340; --kn-soft: #3A1E1C; --ta-soft: #12302C; --tip: #2E2814; --tip-ink: #F2D37A;
    --es: #FFB86B; --it: #C4A6FF; --fr: #6CC4F0; --es-soft: #3A2A14; --it-soft: #2A2140; --fr-soft: #12293A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.5; }
a { color: var(--te); }
/* Each language element carries lc-xx; rules below read the three variables it sets. */
.lc-te { --lc: var(--te); --lc-soft: var(--te-soft); --lf: var(--f-te); }
.lc-kn { --lc: var(--kn); --lc-soft: var(--kn-soft); --lf: var(--f-kn); }
.lc-ta { --lc: var(--ta); --lc-soft: var(--ta-soft); --lf: var(--f-ta); }
.lc-es { --lc: var(--es); --lc-soft: var(--es-soft); --lf: var(--f-lat); }
.lc-it { --lc: var(--it); --lc-soft: var(--it-soft); --lf: var(--f-lat); }
.lc-fr { --lc: var(--fr); --lc-soft: var(--fr-soft); --lf: var(--f-lat); }
:focus-visible { outline: 2px solid var(--te); outline-offset: 2px; border-radius: 4px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; max-width: 1280px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); }
.ctrls { margin-left: auto; }
.brand b { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-family: var(--f-te); color: var(--muted); font-size: .95rem; }
.ctrls { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--sunk); }
.seg button { font: inherit; font-size: .9rem; border: 0; background: transparent; color: var(--muted); padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.langs { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.lg { font: inherit; font-family: var(--lf); font-size: .88rem; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--lc); background: var(--surface); color: var(--lc); cursor: pointer; }
.lg[aria-pressed="true"] { background: var(--lc); color: var(--surface); }
.lg[aria-pressed="true"]::before { content: "✓ "; }
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); cursor: pointer; }
.sw input { accent-color: var(--te); width: 16px; height: 16px; }
.menu-btn { display: none; font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }

/* Shell: one centred reading column, bottom bar for Back / Path / Next */
.shell { max-width: 960px; margin: 0 auto; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px calc(110px + env(safe-area-inset-bottom, 0px)); }
.mini { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: .82rem; text-decoration: none; color: var(--muted); white-space: nowrap; }
.mini .pk { color: var(--lc); font-family: var(--lf); }
.flow { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -4px 16px rgb(0 0 0 / .06); }
.fl { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding: 8px 12px; border-radius: 10px; text-decoration: none; color: var(--ink); border: 1px solid var(--line); }
.fl small { font-size: .74rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.fl span { font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-next { text-align: right; background: var(--te); border-color: var(--te); color: var(--surface); }
.fl-next small { color: var(--surface); opacity: .85; }
.fl-none { border: 0; background: none; }
.fl-map { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 14px; border-radius: 10px; text-decoration: none; color: var(--te); font-size: .74rem; font-weight: 700; }
.fl-map svg { fill: var(--te); stroke: var(--te); }
.fl-map.on { background: var(--te-soft); }
@media (min-width: 961px) { .flow { grid-template-columns: minmax(0, 420px) auto minmax(0, 420px); justify-content: center; } }

/* Module page */
.mod, .home { max-width: 920px; }
.eyebrow { margin: 0 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
h1 { font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.015em; text-wrap: balance; font-weight: 700; }
h2 { font-size: 1.3rem; margin: 0 0 8px; line-height: 1.25; text-wrap: balance; font-weight: 650; }
.trio { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font-size: 1.02rem; padding: 3px 12px; border-radius: 999px; border: 1px solid transparent; }
.pill { font-family: var(--lf); background: var(--lc-soft); color: var(--lc); }
.big { margin: 24px 0 8px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--te); border-radius: var(--r); }
.big-k, .tip-k { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--te); margin-bottom: 4px; }
.big p { margin: 0; font-family: var(--f-prose); font-size: 1.08rem; line-height: 1.6; }
.sec { margin-top: 36px; }
.lede { font-family: var(--f-prose); color: var(--ink); max-width: 68ch; margin: 0 0 12px; line-height: 1.6; }
.tip { margin-top: 10px; padding: 10px 14px; background: var(--tip); color: var(--tip-ink); border-radius: 8px; }
.tip-k { color: var(--tip-ink); }
.tip p { margin: 0; font-family: var(--f-prose); line-height: 1.55; }
.zha { text-decoration: underline 2px dotted; text-underline-offset: 3px; }

/* Comparison table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.cmp { width: 100%; border-collapse: collapse; }
.cmp th { text-align: left; font-size: .82rem; font-weight: 700; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
.cmp th.c-en { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: .72rem; }
.cmp th.c-te { color: var(--te); font-family: var(--f-te); }
.cmp th.c-l { color: var(--lc); font-family: var(--lf); }
.cmp td { padding: 9px 12px; vertical-align: top; border-top: 1px solid var(--line); }
.cmp tbody tr:first-child td { border-top: 0; }
.cmp td.c-en { color: var(--muted); font-size: .9rem; width: 22%; }
.nat { display: block; font-size: 1.12rem; line-height: 1.4; }
.c-te .nat { font-family: var(--f-te); }
.c-l .nat { font-family: var(--lf); color: var(--lc); }
.rd { display: block; font-family: var(--f-te); font-size: .86rem; color: var(--muted); margin-top: 1px; }
[data-read="off"] .rd { display: none; }

/* Practice mode */
[data-practice="on"] td.hide-able { cursor: pointer; position: relative; }
[data-practice="on"] td.hide-able > * { filter: blur(7px); opacity: .55; transition: filter .15s, opacity .15s; user-select: none; }
[data-practice="on"] td.hide-able.revealed > * { filter: none; opacity: 1; user-select: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Module footer */
.mod-f { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.done-btn { align-self: flex-start; font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--ta); color: var(--ta); background: var(--surface); cursor: pointer; }
.done-btn[aria-pressed="true"] { background: var(--ta); color: var(--surface); }
.src { font-size: .88rem; color: var(--muted); margin: 0; max-width: 72ch; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pn-a { display: flex; flex-direction: column; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); background: var(--surface); font-weight: 600; }
.pn-a small { color: var(--muted); font-weight: 500; font-size: .8rem; }
.pn-a:hover { border-color: var(--te); }
.pn-n { text-align: right; }

/* Home */
.hero { padding: 8px 0 8px; }
.hero h1 { font-size: clamp(2rem, 4.6vw, 3.3rem); max-width: 18ch; }
.hero-p { font-family: var(--f-prose); font-size: 1.12rem; line-height: 1.6; max-width: 62ch; margin: 18px 0 0; }
.bridge { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 24px; max-width: 640px; }
.b { display: flex; flex-direction: column; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.b-w { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.15; font-weight: 600; }
.b-r { font-family: var(--f-te); color: var(--muted); font-size: .95rem; }
.b-l { margin-top: 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.b .b-w { font-family: var(--lf); color: var(--lc); } .b .b-l { color: var(--lc); }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; background: var(--te); color: var(--surface); text-decoration: none; font-weight: 600; }
.btn-2 { background: transparent; color: var(--te); border: 1px solid var(--te); }
.howto, .mods { margin-top: 44px; }
.demo { max-width: 720px; }
.keys { font-family: var(--f-prose); padding-left: 1.2em; margin: 12px 0 0; display: flex; flex-direction: column; gap: 4px; max-width: 68ch; }
.hgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 28px; }
.hg h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.hl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.hl a { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; padding: 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.hl a:hover { background: var(--surface); }
.hl-n { font-variant-numeric: tabular-nums; color: var(--te); font-weight: 700; }
.hl-t { font-weight: 600; line-height: 1.3; }
.hl-t small { display: block; font-weight: 400; color: var(--muted); font-size: .84rem; }
.home > .src { margin-top: 36px; }

/* Converter tool */
.tl { display: block; font-weight: 600; margin: 24px 0 6px; }
#tool-in { width: 100%; font-family: var(--f-ui); font-size: 1.3rem; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { font: inherit; font-size: .88rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--te); }
.out { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.o { padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.o[class*="lc-"] { border-left: 4px solid var(--lc); }
.o-k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.o-v { margin: 4px 0 0; font-size: 1.45rem; line-height: 1.4; word-break: break-word; }
.o[class*="lc-"] .o-v { font-family: var(--lf), var(--f-te); color: var(--lc); }
.o-n { margin: 6px 0 0; font-size: .88rem; color: var(--muted); }

/* Narrow screens */
@media (max-width: 640px) {
  .top { position: static; padding-block: 8px; }
  .top-in { gap: 6px 10px; }
  .brand b { font-size: 1.1rem; }
  .seg button { padding: 3px 9px; font-size: .84rem; }
  .ctrls { gap: 6px 12px; }
  .brand span { display: none; }
  .mini { margin-left: auto; }
  .ctrls { width: 100%; justify-content: space-between; }
  .sw { font-size: .82rem; }
  .hgs { grid-template-columns: minmax(0, 1fr); }
  .cmp thead { display: none; }
  .cmp, .cmp tbody, .cmp tr, .cmp td { display: block; width: 100%; }
  .cmp tr { padding: 10px 12px; border-top: 1px solid var(--line); }
  .cmp tbody tr:first-child { border-top: 0; }
  .cmp td { border: 0; padding: 3px 0; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: baseline; }
  .cmp td::before { content: attr(data-l); font-size: .74rem; font-weight: 700; color: var(--muted); }
  .cmp td.c-te::before { color: var(--te); font-family: var(--f-te); }
  .cmp td.c-l::before { color: var(--lc); font-family: var(--lf); }
  .cmp td.c-en { width: 100%; display: block; font-weight: 600; color: var(--ink); padding-bottom: 4px; }
  .cmp td.c-en::before { content: none; }
  .cmp td > span { grid-column: 2; }
  .pn { grid-template-columns: minmax(0, 1fr); }
  .pn-n { text-align: left; }
}

/* Progress tracking */
.dots { display: inline-flex; gap: 4px; align-items: center; }
.d { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid; vertical-align: middle; }
.d { border-color: var(--lc); }
.d.s1 { background: linear-gradient(90deg, var(--lc) 50%, transparent 50%); }
.d.s2 { background: var(--lc); }
.judge { display: none; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
[data-practice="on"] td.hide-able.revealed .judge { display: flex; filter: none; opacity: 1; }
.judge button { font: inherit; font-size: .78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.judge .j-ok { color: var(--ta); border-color: var(--ta); } .judge .j-no { color: var(--kn); border-color: var(--kn); }
[data-practice="on"] td.k-ok { box-shadow: inset 3px 0 0 var(--ta); }
[data-practice="on"] td.k-no { box-shadow: inset 3px 0 0 var(--kn); }
[data-practice="on"] td.k-ok .j-ok { background: var(--ta); color: var(--surface); }
[data-practice="on"] td.k-no .j-no { background: var(--kn); color: var(--surface); }
.pbar { margin-top: 16px; padding: 12px 16px; border-radius: var(--r); background: var(--te-soft); color: var(--ink); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.pbar p { margin: 0; max-width: 62ch; font-size: .93rem; }
.link-btn { font: inherit; font-size: .88rem; background: none; border: 0; color: var(--te); text-decoration: underline; cursor: pointer; padding: 4px 0; }
.link-btn.danger { color: var(--kn); }
.panel { padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; gap: 12px; }
.panel-h { display: block; font-size: 1.05rem; font-weight: 650; margin: 0; }
.stat { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.stat-l { font-weight: 700; color: var(--lc); font-family: var(--lf); }
.stat-l small { font-family: var(--f-ui); color: var(--muted); font-weight: 500; font-size: .8rem; }
.seg-s { justify-self: start; flex-wrap: wrap; }
.stat .seg-s button[aria-pressed="true"] { background: var(--lc); color: var(--surface); }
.score { grid-column: 2; margin: 0; font-size: .84rem; color: var(--muted); }
#note { width: 100%; font: inherit; font-family: var(--f-prose); font-size: 1rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.hint { margin: 0; font-size: .84rem; color: var(--muted); }
.resume { display: flex; flex-direction: column; padding: 14px 18px; margin-bottom: 24px; border-radius: var(--r); background: var(--te); color: var(--surface); text-decoration: none; }
.resume-k { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .85; }
.resume-t { font-size: 1.3rem; font-weight: 700; }
.resume-s { font-size: .86rem; opacity: .9; }
.hc { margin: 22px 0 0; font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--te); }
.pt-h { margin: 18px 0 8px; font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.g-course { fill: var(--te); font-size: 11.5px; }
.stages { list-style: none; padding: 0; margin: 14px 0 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.stages li:not(.stg-arr) { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: min(320px, 100%); }
.stg-n { width: 26px; height: 26px; border-radius: 50%; background: var(--te-soft); color: var(--te); font-weight: 700; display: grid; place-items: center; font-size: .85rem; flex: none; }
.stg-t { font-weight: 600; } .stg-t small { display: block; font-weight: 400; color: var(--muted); font-size: .82rem; }
.stg-arr { color: var(--te); padding-left: 24px; font-weight: 700; line-height: 1.1; }

/* Learning path graph */
.map-tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 20px; }
.graph { max-width: 520px; }
.graph svg { display: block; overflow: visible; }
.g-edge { stroke: var(--line); stroke-width: 2.5; }
.g-edge.g-done { stroke: var(--ta); }

// Kannada -> Telugu script: the two Unicode blocks are aligned, so this is exact.
function knToTe(s) {
  let o = "";
  for (const ch of s) {
    const c = ch.codePointAt(0);
    o += (c >= 0x0C80 && c <= 0x0CFF) ? String.fromCodePoint(c - 0x80) : ch;
  }
  return o;
}
function teToKn(s) {
  let o = "";
  for (const ch of s) {
    const c = ch.codePointAt(0);
    o += (c >= 0x0C00 && c <= 0x0C7F) ? String.fromCodePoint(c + 0x80) : ch;
  }
  return o;
}

// Tamil -> Telugu-script pronunciation, applying Tamil voicing rules.
const TA_V = { "அ":"అ","ஆ":"ఆ","இ":"ఇ","ஈ":"ఈ","உ":"ఉ","ஊ":"ఊ","எ":"ఎ","ஏ":"ఏ","ஐ":"ఐ","ஒ":"ఒ","ஓ":"ఓ","ஔ":"ఔ" };
const TA_S = { "ா":"ా","ி":"ి","ீ":"ీ","ு":"ు","ூ":"ూ","ெ":"ె","ே":"ే","ை":"ై","ொ":"ొ","ோ":"ో","ௌ":"ౌ","்":"్" };
const TA_C = { "ங":"ఙ","ஞ":"ఞ","ண":"ణ","ந":"న","ன":"న","ம":"మ","ய":"య","ர":"ర","ல":"ల","வ":"వ","ள":"ళ","ழ":"ఴ","ஜ":"జ","ஶ":"శ","ஷ":"ష","ஸ":"స","ஹ":"హ","ற":"ఱ" };
const TA_STOP = { "க":["క","గ","క"], "ச":["స","స","చ","జ"], "ட":["ట","డ","ట"], "த":["త","ద","త"], "ப":["ప","బ","ప"] };
const TA_NASAL = new Set(["ங","ஞ","ண","ந","ன","ம"]);
const TA_HARD = new Set(["க","ச","ட","த","ப","ற","ஷ","ஸ","ஶ"]);
const TA_HOMORG = { "ங":"க", "ஞ":"ச", "ண":"ட", "ந":"த", "ம":"ப", "ன":"ற" };
const TA_WORDS = { "சென்னை":"చెన్నై", "சென்னையை":"చెన్నైయై", "சின்ன":"చిన్న", "சின்னது":"చిన్నదు", "காபி":"కాపి", "அஃறிணை":"అహ్ఱిణై", "சீக்கிரம்":"సీక్కిరమ్" };

function taUnits(word) {
  const u = [];
  const chars = [...word];
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    if (TA_STOP[ch] || TA_C[ch] || ch === "க") {
      let sign = "";
      if (TA_S[chars[i + 1]]) { sign = chars[i + 1]; i++; }
      u.push({ t: "c", c: ch, s: sign });
    } else if (TA_V[ch]) u.push({ t: "v", v: ch });
    else if (ch === "ஃ") u.push({ t: "x", raw: "హ్" });
    else u.push({ t: "x", raw: ch });
  }
  return u;
}

function taWord(word, prevWordEnd) {
  if (TA_WORDS[word]) return TA_WORDS[word];
  const u = taUnits(word);
  let out = "";
  for (let i = 0; i < u.length; i++) {
    const x = u[i], prev = u[i - 1] || null, next = u[i + 1] || null;
    if (x.t === "v") { out += TA_V[x.v]; continue; }
    if (x.t === "x") { out += x.raw; continue; }
    const pulli = x.s === "்";
    // nasal + homorganic stop -> anusvara
    if (pulli && TA_NASAL.has(x.c) && next && next.t === "c" && TA_HOMORG[x.c] === next.c && !(prev && prev.t === "c" && prev.s === "்")) { out += "ం"; continue; }
    let base;
    if (TA_STOP[x.c]) {
      const m = TA_STOP[x.c];
      let mode; // 0 initial, 1 soft, 2 hard (geminate), 3 voiced after nasal
      if (pulli) mode = 2; // a stop with no vowel is always voiceless (க்க, ட்க, final ட்)
      else if (!prev) mode = (prevWordEnd && prevWordEnd.c === x.c && prevWordEnd.s === "்") ? 2 : 0;
      else if (prev.t === "c" && prev.s === "்") {
        if (prev.c === x.c) mode = 2;
        else if (TA_NASAL.has(prev.c)) mode = 3;
        else if (TA_HARD.has(prev.c)) mode = 2;
        else mode = 1;
      } else mode = 1;
      if (x.c === "ச") base = mode === 0 ? "స" : mode === 1 ? "స" : mode === 2 ? "చ" : "జ";
      else base = mode === 0 || mode === 2 ? m[0] : m[1];
    } else if (x.c === "ற") {
      if (prev && prev.t === "c" && prev.s === "்" && prev.c === "ன") base = "డ్ర";
      else if (prev && prev.t === "c" && prev.s === "்" && prev.c === "ற") base = "ర";
      else if (pulli && next && next.t === "c" && next.c === "ற") { out += "ట్"; continue; }
      else if (pulli && next && next.t === "c") { out += "ర్"; continue; }
      else base = "ఱ";
    } else base = TA_C[x.c];
    out += base + (x.s ? TA_S[x.s] : "");
  }
  return out;
}

function taToTe(s) {
  // "|" marks a compound boundary; split into words while keeping separators
  const parts = s.split(/([\s|.,?!;:()\/·→—“”"'-]+)/);
  let out = "", lastUnits = null;
  for (const p of parts) {
    if (!p) continue;
    if (/^[\s|.,?!;:()\/·→—“”"'-]+$/.test(p)) {
      out += p.replace(/\|/g, "");
      if (/[^\s|]/.test(p.replace(/\|/g, ""))) lastUnits = null; // punctuation breaks gemination
      continue;
    }
    if (!/[஀-௿]/.test(p)) { out += p; lastUnits = null; continue; }
    const prevEnd = lastUnits && lastUnits.length ? lastUnits[lastUnits.length - 1] : null;
    out += taWord(p, prevEnd && prevEnd.t === "c" ? prevEnd : null);
    lastUnits = taUnits(p);
  }
  return out;
}

// Telugu -> Tamil letters (approximate, letter by letter) for the converter tool
const TE_TA_C = { "క":"க","ఖ":"க","గ":"க","ఘ":"க","ఙ":"ங","చ":"ச","ఛ":"ச","జ":"ஜ","ఝ":"ஜ","ఞ":"ஞ","ట":"ட","ఠ":"ட","డ":"ட","ఢ":"ட","ణ":"ண","త":"த","థ":"த","ద":"த","ధ":"த","న":"ந","ప":"ப","ఫ":"ப","బ":"ப","భ":"ப","మ":"ம","య":"ய","ర":"ர","ఱ":"ற","ల":"ல","వ":"வ","శ":"ஶ","ష":"ஷ","స":"ஸ","హ":"ஹ","ళ":"ள","ఴ":"ழ" };
const TE_ROW = c => "కఖగఘఙ".includes(c) ? "ங்" : "చఛజఝఞ".includes(c) ? "ஞ்" : "టఠడఢణ".includes(c) ? "ண்" : "తథదధన".includes(c) ? "ந்" : "ம்";
function teToTa(s) {
  const ch = [...s]; let o = "";
  for (let i = 0; i < ch.length; i++) {
    const c = ch[i], cp = c.codePointAt(0);
    if (TE_TA_C[c]) {
      let t = TE_TA_C[c];
      if (c === "న") {
        const prevIsLetter = i > 0 && /[ఀ-౿]/.test(ch[i - 1]);
        const nextCons = ch[i + 1] === "్" ? ch[i + 2] : null;
        if (prevIsLetter && !(nextCons && "తథదధ".includes(nextCons))) t = "ன";
      }
      o += t;
    } else if (c === "ం") o += TE_ROW(ch[i + 1] || "");
    else if (c === "ః") o += "ஃ";
    else if (c === "ఋ") o += "ரு";
    else if (c === "ృ") o += "்ரு";
    else if (cp >= 0x0C05 && cp <= 0x0C14) o += String.fromCodePoint(cp - 0x80);
    else if (cp >= 0x0C3E && cp <= 0x0C4D) o += String.fromCodePoint(cp - 0x80);
    else if (cp >= 0x0C66 && cp <= 0x0C6F) o += String.fromCodePoint(cp - 0x80);

}


/* ---------- Spanish / Italian -> Telugu-script reading ---------- */
// Both spellings are regular enough to read by rule. Vowels use the long Telugu forms (a ā, e ē, o ō),
// which is how a Telugu speaker hears the open Spanish/Italian vowels. Cells can override with [text, reading].
const TE_VOW = { a: ["ఆ", "ా"], e: ["ఏ", "ే"], i: ["ఇ", "ి"], o: ["ఓ", "ో"], u: ["ఉ", "ు"], au: ["ఔ", "ౌ"] };
const LAT_C = { b: "బ", d: "ద", f: "ఫ", k: "క", l: "ల", m: "మ", n: "న", p: "ప", r: "ర", s: "స", t: "త", v: "వ", w: "వ" };

function teSyllables(units) {
  // units: {c: consonant(s)} | {v: "a".."u"} | {x: raw}
  let o = "";
  for (let i = 0; i < units.length; i++) {
    const u = units[i], n = units[i + 1];
    if (u.x !== undefined) o += u.x;
    else if (u.v) o += TE_VOW[u.v][0];
    else if (n && n.v) { o += u.c + TE_VOW[n.v][1]; i++; }
    else if ((u.c === "న" || u.c === "మ") && n && n.c && n.c !== u.c) o += "ం"; // n/m before another consonant: anusvara
    else o += u.c + "్";

}

function latUnits(word, lang) {

      u.push({ v: c }); continue;
    }
    if (c === "\u0001") { u.push({ c: "న్య" }); continue; }
    if (c === "\u0002") { u.push({ c: "వ" }); continue; }
    if (c === "h") continue;

      if (c === "l" && n === "l") { u.push({ c: "య" }); i++; continue; }

}

function latToTe(s, lang) {
  return s.split(/([^A-Za-zÀ-ÿ'’]+)/).map(p => /[A-Za-zÀ-ÿ]/.test(p) ? teSyllables(latUnits(p, lang)) : p).join("");

const esToTe = s => latToTe(s, "es");
const itToTe = s => latToTe(s, "it");

/* ---------- Languages and courses ---------- */
// Telugu is always the base. The learner picks any of these targets at the top of every page.

const on = l => S.prefs.langs.includes(l);
const act = c => c.langs.filter(on);                 // languages of a course that are switched on
const activeCourses = () => COURSES.filter(c => act(c).length);

const list = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];

/* ---------- Rendering helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const zha = s => esc(s).replace(/ఴ/g, '<span class="zha" title="Tamil ழ (zh)">ళ</span>');
const clean = s => s.replace(/\|/g, "");

// Resolve the ⟦cond|text⟧ / ⟦#langs⟧ prose markup (documented in data/04-europe.js) for the current languages.
function T(s, c) {
  if (s == null) return "";
  const a = act(c);
  const ok = cond => cond.trim().split(/\s+/).every(t => t === "one" ? a.length === 1 : t === "many" ? a.length > 1 : t[0] === "!" ? !on(t.slice(1)) : on(t));
  return String(s)
    .replace(/⟦#langs\+te⟧/g, () => list(["Telugu"].concat(a.map(l => LANG[l].en))))
    .replace(/⟦#langs⟧/g, () => list(a.map(l => LANG[l].en)))
    .replace(/⟦([^|⟧]*)\|([^⟧]*)⟧/g, (_, cond, t) => ok(cond) ? t : "")
    .replace(/\s+([.,;:])/g, "$1").trim();
}
const holds = (cond, c) => !cond || T(`⟦${cond}|x⟧`, c) === "x";

// A row's cell for language l: { text, reading } or null when the row has no such column.
function cellOf(c, r, l) {
  const i = c.langs.indexOf(l);
  if (i < 0) return null;
  const v = r[2 + i];
  if (v == null) return null;
  if (Array.isArray(v)) return { text: v[0], reading: v[1] };
  return { text: v, reading: c.key === "dr" && l === "ta" && typeof r[4] === "string" ? r[4] : null };
}
const rowOpt = r => r.find(x => x && typeof x === "object" && !Array.isArray(x)) || {};
const hasCell = (c, r, l) => { const x = cellOf(c, r, l); return !!x && x.text !== "—"; };
const rowShown = (c, r) => holds(rowOpt(r).only, c) && act(c).some(l => hasCell(c, r, l));
const secShown = (c, sec) => holds(sec.only, c) && sec.rows.some(r => rowShown(c, r));

function reading(l, x) {
  if (x.reading) return l === "ta" ? zha(x.reading) : esc(x.reading);
  if (l === "kn") return esc(knToTe(x.text));
  if (l === "ta") return zha(taToTe(x.text));
  if (l === "es") return esc(esToTe(x.text));
  if (l === "it") return esc(itToTe(x.text));
  return ""; // French readings are always written by hand
}
function cell(l, x, noRead) {
  const native = `<span class="nat">${esc(clean(x.text))}</span>`;
  if (noRead || x.text === "—") return native;
  const rd = reading(l, x);
  return rd ? `${native}<span class="rd" aria-label="Telugu reading">${rd}</span>` : native;
}

const JUDGE = `<span class="judge" role="group" aria-label="How did you do?"><button type="button" class="j-ok" data-j="1">✓ Knew it</button><button type="button" class="j-no" data-j="-1">✗ Missed</button></span>`;

function table(sec, pageId, si, c) {

    const td = l => {
      const x = cellOf(c, r, l) || { text: "—" }, scoreable = pageId && x.text !== "—";
      const cls = mark[l] === 1 ? " k-ok" : mark[l] === -1 ? " k-no" : "";
      return `<td class="c-l lc-${l} hide-able${cls}" data-l="${esc(LANG[l].nat)}"${scoreable ? ` data-k="${key}" data-lg="${l}"` : ""}>${cell(l, x, sec.noRead)}${scoreable ? JUDGE : ""}</td>`;
    };
    return `<tr>
      <td class="c-en" data-l="Meaning">${esc(T(r[0], c))}</td>
      <td class="c-te" data-l="తెలుగు"><span class="nat">${esc(r[1])}</span></td>
      ${ls.map(td).join("")}
    </tr>`;
  }).join("");
  return `<div class="tablewrap"><table class="cmp">${head}<tbody>${body}</tbody></table></div>`;
}

function sectionHTML(pageId, c) {
  return (sec, i) => {
    if (!secShown(c, sec)) return "";
    const p = T(sec.p, c), tip = T(sec.tip, c);
    return `<section class="sec" id="s${i}">
    <h2>${esc(T(sec.h, c))}</h2>
    ${p ? `<p class="lede">${p}</p>` : ""}
    ${table(sec, pageId, i, c)}
    ${tip ? `<aside class="tip"><span class="tip-k">Telugu shortcut</span><p>${tip}</p></aside>` : ""}
  </section>`;
  };
}

/* ---------- On-device memory ---------- */
// Uses the native Preferences store inside the iOS/Android app, and browser storage on the web.
const KV = (() => {
  const P = () => { try { return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences; } catch (e) { return null; } };
  const KEY = "sb_state";
  return {
    async load() {
      try { const p = P(); if (p) { const r = await p.get({ key: KEY }); if (r && r.value) return JSON.parse(r.value); } } catch (e) {}
      try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; }
    },
    save(obj) {
      const s = JSON.stringify(obj);
      try { localStorage.setItem(KEY, s); } catch (e) {}
      try { const p = P(); if (p) p.set({ key: KEY, value: s }); } catch (e) {}
    }
  };
})();

const blank = () => ({ v: 2, status: {}, scores: {}, notes: {}, days: {}, prefs: { langs: ["kn", "ta"], read: true, practice: false }, last: null, lastPath: "home" });
let S = blank();
function adopt(o) {
  S = Object.assign(blank(), o);
  S.prefs = Object.assign(blank().prefs, S.prefs);
  // earlier versions stored one choice: "both", "kn" or "ta"
  if (S.prefs.lang) { S.prefs.langs = S.prefs.lang === "both" ? ["kn", "ta"] : [S.prefs.lang]; delete S.prefs.lang; }
  S.prefs.langs = ALL.filter(l => S.prefs.langs.includes(l));
  if (!S.prefs.langs.length) S.prefs.langs = ["kn"];
}
let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  if (now) KV.save(S); else saveTimer = setTimeout(() => KV.save(S), 250);
}
function legacy() {
  // carry over "done" marks from the first version of the site
  try {
    const d = JSON.parse(localStorage.getItem("sb_done") || "{}");
    for (const k in d) if (d[k]) S.status[k] = { kn: 2, ta: 2 };
    const lang = JSON.parse(localStorage.getItem("sb_lang") || "null"); if (lang) S.prefs.langs = lang === "both" ? ["kn", "ta"] : [lang];
  } catch (e) {}
}
const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function activity(n = 1) { const t = today(); S.days[t] = (S.days[t] || 0) + n; save(); }
function streak() {
  let n = 0; const d = new Date();
  if (!S.days[today(d)]) d.setDate(d.getDate() - 1); // a streak survives until the end of today
  while (S.days[today(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
const st = (id, l) => (S.status[id] && S.status[id][l]) || 0;
function setStatus(id, l, v) { S.status[id] = S.status[id] || {}; S.status[id][l] = v; activity(); }
function rowTotal(m, l) { let n = 0; m.sections.forEach(s => { if (secShown(m.course, s)) s.rows.forEach(r => { if (rowShown(m.course, r) && hasCell(m.course, r, l)) n++; }); }); return n; }
function scoreOf(id, l) {
  const sc = S.scores[id] || {}; let ok = 0, no = 0;
  for (const k in sc) { if (sc[k][l] === 1) ok++; else if (sc[k][l] === -1) no++; }
  return { ok, no, seen: ok + no };
}

const root = document.documentElement;
function applyPrefs() {

const OFF = { progress: "My Progress", tool: "Script Converter", map: "Learning Path" };

function counts() {
  const r = {};

}

function renderFlow(active) {

  }

}

function renderMap() {

      items.push({ t: "stage", label: g.name });
      g.ids.forEach(id => { const m = MOD[id]; items.push({ t: "node", id, n: String(c.ordered.indexOf(m) + 1).padStart(2, "0"), title: m.en, sub: titles(m), m }); });

  const W = 360, X = 30, NH = 58, GAP = 30, SH = 30;

    nodes += `<a href="#${it.id}" class="g-node${isHere ? " here" : ""}${done ? " done" : ""}" aria-label="${esc(it.title)}${stateTxt ? ". " + stateTxt : ""}${isHere ? ". You are here" : ""}">
      <rect class="g-card" x="${X + 26}" y="${y}" width="${W - X - 34}" height="${NH}" rx="10"/>
      <circle class="g-dot" cx="${X}" cy="${cy}" r="15"/>

      <text class="g-sub" x="${X + 40}" y="${y + 43}">${esc(it.sub)}</text>
      ${ls.map((l, k) => `<circle class="g-s lc-${l} s${st(it.id, l)}" cx="${W - 20 - 14 * (ls.length - 1 - k)}" cy="${y + 19}" r="5"/>`).join("")}
      ${isHere ? `<text class="g-here" x="${W - 14}" y="${y + 47}" text-anchor="end">YOU ARE HERE</text>` : ""}
    </a>`;
  }

    <header class="mod-h"><p class="eyebrow">Learning path</p><h1>Your route through the course</h1>
      <p class="lede">Follow the arrows from top to bottom. Tap any step to jump straight to it. The small dots on each step show your status in ${S.prefs.langs.map(l => `<span class="c-l lc-${l}">${LANG[l].en}</span>`).join(S.prefs.langs.length > 2 ? ", " : " and ")}: hollow = not started, half = learning, filled = done.</p></header>
    <div class="map-tools"><a class="btn" href="#${here === "home" ? first : here}">${here === "home" ? "Start module 1" : "Continue: " + esc(pageName(here))}</a><a class="btn btn-2" href="#progress">My Progress</a><a class="btn btn-2" href="#tool">Script Converter</a></div>
    <div class="graph"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Learning path: ${pos.length} steps in order">
      <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="g-arrow"/></marker></defs>
      ${svg}${edges}${nodes}</svg></div>
  </article>`;
  const h = view.querySelector(".g-node.here");
  if (h) setTimeout(() => { const r = h.getBoundingClientRect(); window.scrollTo(0, Math.max(0, window.scrollY + r.top - window.innerHeight / 3)); }, 30);

function wireModule(id, m) {
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => {
    setStatus(id, b.dataset.st, +b.dataset.v);

    };

}

function calendarHTML() {
  // 12 weeks, columns = weeks, rows = Mon..Sun, ending this week
  const end = new Date(); const dow = (end.getDay() + 6) % 7;
  const start = new Date(end); start.setDate(end.getDate() - dow - 7 * 11);
  let cells = "";
  for (let w = 0; w < 12; w++) for (let d = 0; d < 7; d++) {
    const day = new Date(start); day.setDate(start.getDate() + w * 7 + d);
    const k = today(day), n = S.days[k] || 0, future = day > end;
    const lv = future ? "f" : n === 0 ? 0 : n < 3 ? 1 : n < 8 ? 2 : n < 20 ? 3 : 4;
    cells += `<i class="cal-c l${lv}" style="grid-column:${w + 1};grid-row:${d + 1}" title="${k}: ${n} activit${n === 1 ? "y" : "ies"}"></i>`;
  }
  const active = Object.keys(S.days).filter(k => S.days[k]).length;
  return `<div class="cal" aria-label="Study activity over the last 12 weeks">${cells}</div>
    <div class="cal-key"><span>Less</span><i class="cal-c l0"></i><i class="cal-c l1"></i><i class="cal-c l2"></i><i class="cal-c l3"></i><i class="cal-c l4"></i><span>More</span><span class="cal-tot">${active} day${active === 1 ? "" : "s"} studied in total</span></div>`;
}

function reviewList() {
  const items = [];
  for (const c of activeCourses()) for (const m of c.ordered.concat([c.bonus])) {
    const sc = S.scores[m.id]; if (!sc) continue;
    for (const k in sc) for (const l of act(c)) if (sc[k][l] === -1) {
      const [si, ri] = k.split(".").map(Number); const r = m.sections[si] && m.sections[si].rows[ri];
      if (!r || !hasCell(c, r, l)) continue;
      items.push({ m, l, r, x: cellOf(c, r, l) });
    }

  if (!items.length) return `<p class="empty">Nothing to review yet. Turn on <b>Practice</b>, open a module, reveal cells and mark the ones you missed. They will collect here.</p>`;
  return `<ul class="rev">${items.slice(0, 40).map(i => `<li><a href="#${i.m.id}" class="rev-m">${esc(i.m.en)}</a>

      <div class="tile t-pr"><span class="tile-k">Practice accuracy</span><span class="tile-v pr-v">${langs.map(l => `<span class="c-l lc-${l}">${pct(l)}</span>`).join("")}</span><span class="tile-s">${langs.map(l => LANG[l].en).join(" · ")}, from ${seenAll} marked answers</span></div>
    </div>
    ${nextUp ? `<a class="next-up" href="#${nextUp.id}"><small>Up next</small>${esc(nextUp.en)} <span>${esc(titles(nextUp))}</span></a>` : `<p class="next-up done-all">Every module is done in ${esc(list(langs.map(l => LANG[l].en)))}. Keep practising with the review list below.</p>`}
    <section class="sec"><h2>Activity</h2>${calendarHTML()}</section>
    <section class="sec"><h2>Every module</h2>${tables}
      <p class="hint">Numbers under each status are practice answers known out of marked.</p></section>
    <section class="sec"><h2>Review list</h2><p class="lede">Answers you marked as missed. Go back to the module and practise them again; marking one “Knew it” removes it from this list.</p>${reviewList()}</section>
    <section class="sec"><h2>Backup</h2>
      <p class="lede">Your progress lives only on this device. To move it to another phone or browser, copy the backup code here and paste it there.</p>
      <div class="bk">
        <button type="button" class="btn" id="bk-copy">Copy backup code</button>
        <label class="tl" for="bk-in">Restore from a backup code</label>
        <textarea id="bk-in" rows="3" placeholder="Paste a backup code here"></textarea>
        <div class="bk-row"><button type="button" class="btn btn-2" id="bk-restore">Restore</button><button type="button" class="link-btn danger" id="bk-reset">Reset all progress</button></div>
        <p class="hint" id="bk-msg" aria-live="polite"></p>
      </div></section>
  </article>`;
  const msg = t => document.getElementById("bk-msg").textContent = t;
  document.getElementById("bk-copy").onclick = async () => {
    const code = JSON.stringify(S);
    try { await navigator.clipboard.writeText(code); msg("Backup code copied. Paste it into My Progress on your other device."); }
    catch (e) { const ta = document.getElementById("bk-in"); ta.value = code; ta.focus(); ta.select(); msg("Copying isn’t allowed here, so the code is selected in the box. Copy it from there."); }
  };
  document.getElementById("bk-restore").onclick = () => {
    try {
      const o = JSON.parse(document.getElementById("bk-in").value.trim());
      if (!o || o.v !== 2 || typeof o.status !== "object") throw 0;
      adopt(o); save(true); applyPrefs(); renderProgress(); refresh();
      document.getElementById("bk-msg").textContent = "Progress restored.";
    } catch (e) { msg("That doesn’t look like a Kannada Learning backup code. Copy the whole code and try again."); }
  };
  let armed = false;
  document.getElementById("bk-reset").onclick = e => {
    if (!armed) { armed = true; e.target.textContent = "Tap again to erase everything"; setTimeout(() => { armed = false; if (e.target.isConnected) e.target.textContent = "Reset all progress"; }, 4000); return; }
    const prefs = S.prefs; S = blank(); S.prefs = prefs; save(true); renderProgress(); refresh(); msg("All progress erased.");
  };
}

function renderTool() {
  const lat = ["es", "it"].filter(on), samples = [{ l: "te", label: "Telugu sample", t: "నేను రేపు మీ ఇంటికి వస్తాను" }].concat([
    { l: "kn", t: "ನಾನು ನಾಳೆ ನಿಮ್ಮ ಮನೆಗೆ ಬರುತ್ತೇನೆ" }, { l: "ta", t: "நான் நாளை உங்கள் வீட்டுக்கு வருவேன்" },
    { l: "es", t: "Mañana voy a tu casa" }, { l: "it", t: "Domani vengo a casa tua" }
  ].filter(x => on(x.l)).map(x => Object.assign(x, { label: LANG[x.l].en + " sample" })));
  const how = [];
  if (on("kn")) how.push("Telugu becomes Kannada letter for letter, which is exact because the two alphabets match.");
  if (on("ta")) how.push("Telugu to Tamil is approximate, since Tamil has fewer letters.");
  const back = ["kn", "ta"].filter(on).map(l => LANG[l].en).concat(lat.map(l => LANG[l].en));
  if (back.length) how.push(`${list(back)} text is shown in Telugu script so you can read it aloud.`);
  if (on("fr")) how.push("French spelling has too many silent letters to read by rule, so French readings appear only in the lessons.");
  view.innerHTML = `<article class="mod">
    <header class="mod-h"><p class="eyebrow">Tool</p><h1>Script Converter</h1>
      ${trio({ te: "లిపి మార్పిడి", kn: "ಲಿಪಿ ಪರಿವರ್ತಕ", ta: "எழுத்து மாற்றி", es: "Conversor de escritura", it: "Convertitore di scrittura" })}</header>
    <div class="big"><span class="big-k">How it works</span><p>Type or paste text. ${how.join(" ")}</p></div>
    <label class="tl" for="tool-in">Your text</label>
    <textarea id="tool-in" rows="3" spellcheck="false">${esc(samples[1] ? samples[1].t : samples[0].t)}</textarea>
    <div class="chips" role="group" aria-label="Examples">
      ${samples.map(x => `<button type="button" class="chip" data-ex="${esc(x.t)}">${x.label}</button>`).join("")}
    </div>
    <div class="out" id="tool-out" aria-live="polite"></div>
  </article>`;
  const inp = document.getElementById("tool-in"), out = document.getElementById("tool-out");
  const run = () => {
    const s = inp.value;
    const hasTe = /[ఀ-౿]/.test(s), hasKn = /[ಀ-೿]/.test(s), hasTa = /[஀-௿]/.test(s), hasLat = /[A-Za-zÀ-ÿ]/.test(s);
    const box = (l, k, v, n) => `<div class="o lc-${l}"><span class="o-k">${k}</span><p class="o-v">${v}</p>${n ? `<p class="o-n">${n}</p>` : ""}</div>`;
    let h = "";
    if (hasTe && on("kn")) h += box("kn", "Kannada script (exact)", esc(teToKn(s)));
    if (hasTe && on("ta")) h += box("ta", "Tamil letters (approximate)", esc(teToTa(s)), "Letter-for-letter only. Real Tamil words often differ: the Telugu ఇంటికి is வீட்டுக்கு in Tamil.");
    if (hasKn && on("kn")) h += box("kn", "Kannada read in Telugu script", esc(knToTe(s)));
    if (hasTa && on("ta")) h += box("ta", "Tamil read in Telugu script", zha(taToTe(s)), "Applies Tamil’s k/g, t/d, p/b rules. An underlined <span class=\"zha\">ళ</span> is Tamil ழ.");
    if (hasLat && on("es")) h += box("es", "Read as Spanish, in Telugu script", esc(esToTe(s)));
    if (hasLat && on("it")) h += box("it", "Read as Italian, in Telugu script", esc(itToTe(s)));
    if (!h) h = `<p class="o-n">Type something in ${list(["Telugu"].concat(["kn", "ta"].filter(on).map(l => LANG[l].en), lat.length ? ["Latin letters"] : []))} to see it converted.</p>`;
    out.innerHTML = h;
  };
  inp.addEventListener("input", run);
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => { inp.value = b.dataset.ex; run(); });
  run();
}

// Demo row for "How to read the tables" and the word in the hero, one cell per language.
const DEMO = { te: "నేను వచ్చాను.", kn: "ನಾನು ಬಂದೆ.", ta: "நான் வந்தேன்.", es: "Vine.", it: "Sono venuto.", fr: ["Je suis venu.", "జ్ స్వీ వ్నూ."] };
const MILK = { te: ["పాలు"], kn: ["ಹಾಲು", "హాలు"], ta: ["பால்", "పాల్"], es: ["leche", "లేచే"], it: ["latte", "లాత్తే"], fr: ["lait", "లే"] };

function renderHome() {
  const cs = activeCourses(), langs = S.prefs.langs, all = names(ON_ALL);
  const P = path();
  const stages = cs.map(c => `${cs.length > 1 ? `<h3 class="hc">${esc(names(c))}</h3>` : ""}
      <ol class="stages">${c.groups.map((g, k) => `<li><span class="stg-n">${k + 1}</span><span class="stg-t">${esc(g.name)}<small>${g.ids.length} module${g.ids.length > 1 ? "s" : ""}</small></span></li>`).join('<li class="stg-arr" aria-hidden="true">↓</li>')}</ol>`).join("");
  const last = S.last && MOD[S.last] && P.includes(S.last) ? MOD[S.last] : null;
  const c = counts();
  const resume = last ? `<a class="resume" href="#${last.id}"><span class="resume-k">Continue where you left off</span><span class="resume-t">${esc(last.en)}</span>
      <span class="resume-s">${langs.map(l => `${LANG[l].nat} ${c[l]}/${total(l)}`).join(" · ")} · ${streak()}-day streak</span></a>` : "";
  const dr = act(COURSES[0]), eu = act(COURSES[1]);
  const why = [];
  if (dr.length) why.push(`${dr.length > 1 ? "Kannada and Tamil are" : LANG[dr[0]].en + " is"} Telugu’s Dravidian sister${dr.length > 1 ? "s" : ""}: ${COURSES[0].ordered.length} grammar modules put each Telugu pattern next to its ${names(COURSES[0])} equivalent${dr.length > 1 ? "s" : ""}.`);
  if (eu.length) why.push(`${names(COURSES[1])} ${eu.length > 1 ? "are" : "is"} not related to Telugu, but ${eu.length > 1 ? "they mark" : "it marks"} the person on the verb just as Telugu does, and ${COURSES[1].ordered.length} modules show each pattern side by side with Telugu.`);
  const first = cs[0].ordered[0];
  view.innerHTML = `<article class="home">
    ${resume}
    <section class="hero">
      <p class="eyebrow">For people who already speak Telugu</p>
      <h1>Learn ${esc(all)} through the Telugu you already know.</h1>
      <div class="bridge" aria-label="The word milk in ${langs.length + 1} languages">
        <div class="b lc-te"><span class="b-w">${MILK.te[0]}</span><span class="b-l">Telugu</span></div>
        ${langs.map(l => `<div class="b lc-${l}"><span class="b-w">${MILK[l][0]}</span><span class="b-r">${MILK[l][1]}</span><span class="b-l">${LANG[l].en}</span></div>`).join("")}
      </div>
      <p class="hero-p">${why.join(" ")} Every word is shown in its own script with a Telugu-script reading underneath, so you can say it before you can read it.</p>
      <div class="cta"><a class="btn" href="#${last ? last.id : first.id}">${last ? "Continue learning" : "Start with " + esc(first.en.toLowerCase())}</a></div>
    </section>
    <section class="howto">
      <h2>How to read the tables</h2>
      <div class="demo">${table({ rows: [["I came."].concat([DEMO.te], ALL.map(l => DEMO[l]))] }, null, 0, ON_ALL)}</div>
      <ul class="keys">
        <li><b>Big letters</b> show how the word is spelled in ${esc(all)}.</li>
        <li><b>Small Telugu letters</b> underneath show how to say it. Turn them off once you can read the ${langs.length > 1 ? "scripts" : "script"}.</li>
        <li><b>Choose your languages</b> with the buttons at the top. Every page shows only the languages you pick.</li>
        <li><b>Practice mode</b> hides the answers. Tap a cell to reveal it, then mark “Knew it” or “Missed”. Missed answers collect in My Progress.</li>
        <li><b>Your progress stays on this device:</b> module status for each language, practice marks, notes and your daily streak.</li>
      </ul>
    </section>
    <section class="mods"><h2>Your learning path</h2><p class="lede">The course is one straight path${cs.length > 1 ? `: first ${esc(names(cs[0]))}, then ${esc(names(cs[1]))}, each ending with a bonus page` : ", the alphabet and sounds first, ending with a bonus page"}. Use <b>Next</b> at the bottom of each page to move forward and <b>Back</b> to go back one step. To jump anywhere, open the <b>Path</b> map in the middle of the bottom bar.</p>
      ${stages}
      <a class="btn btn-2" href="#map">Open the learning path map</a></section>
    ${on("kn") ? `<p class="src">The grammar sequence and Kannada examples follow the 18 “Learn Basics” modules of <a href="https://kannadakalike.org/grammar-modules.php" target="_blank" rel="noopener">Kannada Kalike</a> (Kannada Language Chair, JNU). Telugu equivalents${on("ta") ? ", Tamil equivalents" : ""} and the Telugu-script readings were added for this course.</p>` : ""}
  </article>`;
}

function route() {
  const id = (location.hash || "#home").slice(1);
  let active = "home";
  if (MOD[id]) { if (!renderModule(id)) return; active = id; }
  else if (id === "tool") { renderTool(); active = "tool"; }
  else if (id === "progress") { renderProgress(); active = "progress"; }
  else if (id === "map") { renderMap(); active = "map"; }
  else renderHome();
  if (path().includes(active) && S.lastPath !== active) { S.lastPath = active; save(); }
  renderFlow(active);
  if (active !== "map") window.scrollTo(0, 0);
}
function refresh() { const id = (location.hash || "#home").slice(1); renderFlow(MOD[id] || OFF[id] ? id : "home"); }

/* ---------- Wiring ---------- */
document.getElementById("langs").innerHTML = ALL.map(l => `<button type="button" class="lg lc-${l}" data-lg-toggle="${l}" aria-pressed="false" title="${LANG[l].en}">${LANG[l].nat}</button>`).join("");
document.querySelectorAll("[data-lg-toggle]").forEach(b => b.onclick = () => {
  const l = b.dataset.lgToggle;
  if (on(l) && S.prefs.langs.length === 1) return; // keep at least one language
  S.prefs.langs = ALL.filter(x => x === l ? !on(x) : on(x));
  save(); applyPrefs();
  const y = window.scrollY; route(); window.scrollTo(0, y);
});
document.getElementById("t-read").onchange = e => { S.prefs.read = e.target.checked; save(); applyPrefs(); };
document.getElementById("t-practice").onchange = e => { S.prefs.practice = e.target.checked; save(); applyPrefs(); const y = window.scrollY; route(); window.scrollTo(0, y); };

view.addEventListener("click", e => {
  const j = e.target.closest(".judge button");
  if (j) {
    const td = j.closest("td"), id = (location.hash || "#home").slice(1), k = td.dataset.k, l = td.dataset.lg, v = +j.dataset.j;
    S.scores[id] = S.scores[id] || {}; S.scores[id][k] = S.scores[id][k] || {};
    if (S.scores[id][k][l] === v) delete S.scores[id][k][l]; else S.scores[id][k][l] = v;
    const m = MOD[id];
    if (m && !m.bonus && st(id, l) === 0) setStatus(id, l, 1);
    activity();
    td.classList.toggle("k-ok", S.scores[id][k][l] === 1);
    td.classList.toggle("k-no", S.scores[id][k][l] === -1);
    if (m && !m.bonus) { document.getElementById("status-panel").outerHTML = statusPanel(id, m); wireModule(id, m); }
    refresh();
    return;
  }
  const td = e.target.closest("td.hide-able");
  if (td && root.dataset.practice === "on") td.classList.toggle("revealed");
});
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(true); });
window.addEventListener("pagehide", () => save(true));

(async () => {
  const saved = await KV.load();
  if (saved && saved.v === 2) adopt(saved); else { legacy(); save(); }
  applyPrefs();
  route();
})();

</script>
